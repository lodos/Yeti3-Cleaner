name: Yeti3Cleaner
options:
  bundleIdPrefix: ru.yeti3
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 49PHJ38L7T
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Yeti3Cleaner:
    type: application
    platform: iOS
    sources: [App, Core, Services, Views, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.yeti3.cleaner.ios
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Yeti3Cleaner.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  Yeti3CleanerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Yeti3Cleaner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  Yeti3CleanerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Yeti3Cleaner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Yeti3Cleaner:
    build:
      targets:
        Yeti3Cleaner: all
    test:
      targets: [Yeti3CleanerTests, Yeti3CleanerUITests]
    archive:
      config: Release
