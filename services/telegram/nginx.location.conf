# Insert inside license.gochain.space's existing HTTPS server, after reviewing it.
# Keep the licensing /internal/ route inaccessible from the public internet.
location = /api/cleaner/telegram/webhook {
    limit_except POST { deny all; }
    client_max_body_size 256k;
    client_body_timeout 10s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 12s;
    proxy_pass http://127.0.0.1:8097/webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    access_log off;
}
